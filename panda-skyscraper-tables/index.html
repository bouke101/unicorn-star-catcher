<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐼 Panda Skyscraper Tables</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1b3d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      overflow: hidden;
    }

    #game-wrap {
      position: relative;
      width: min(480px, 100vw);
      height: min(720px, 100dvh);
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(80, 160, 255, 0.5);
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── HUD ── */
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(255,255,255,0.75);
      z-index: 10;
      font-size: 18px;
      font-weight: bold;
      color: #1b2a4a;
    }
    #hud .streak { color: #e8590c; }

    /* ── City scene ── */
    #scene {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: linear-gradient(180deg, #7cc8ff 0%, #b9e3ff 60%, #e6f6ff 100%);
    }
    .cloud {
      position: absolute;
      font-size: 46px;
      opacity: 0.9;
      animation: drift linear infinite;
    }
    @keyframes drift {
      from { transform: translateX(-80px); }
      to   { transform: translateX(560px); }
    }
    .sun {
      position: absolute;
      top: 56px; right: 26px;
      font-size: 54px;
    }

    #world {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 100%;
      transition: transform 0.6s ease;
    }

    /* Background skyscrapers */
    .bg-building {
      position: absolute;
      bottom: 46px;
      border-radius: 4px 4px 0 0;
      background-image:
        linear-gradient(90deg, transparent 60%, rgba(255,255,255,0.08) 60%),
        radial-gradient(circle, #ffe9a8 2.5px, transparent 3px);
      background-size: 100% 100%, 14px 16px;
      background-position: 0 0, 4px 6px;
    }
    .bg-building::before {          /* antenna */
      content: '';
      position: absolute;
      left: 50%; top: -18px;
      width: 3px; height: 18px;
      background: #556;
    }

    #ground {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 46px;
      background: linear-gradient(180deg, #5cb85c 0 10px, #6b6f7a 10px 100%);
    }
    #ground::after {               /* road markings */
      content: '';
      position: absolute;
      left: 0; right: 0; top: 26px;
      height: 4px;
      background: repeating-linear-gradient(90deg, #fff 0 22px, transparent 22px 44px);
      opacity: 0.8;
    }
    .bamboo {
      position: absolute;
      bottom: 40px;
      font-size: 30px;
    }

    /* The panda's own tower */
    #tower {
      position: absolute;
      bottom: 46px;
      left: 50%;
      width: 150px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
    }
    .floor {
      position: relative;
      width: 150px;
      height: 34px;
      background: var(--c, #e85d75);
      border: 3px solid rgba(0,0,0,0.25);
      border-bottom: none;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      animation: drop-in 0.45s cubic-bezier(.3,1.6,.5,1);
    }
    .floor .win {
      width: 18px; height: 18px;
      background: #fff6c2;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 3px;
    }
    .floor .label {
      position: absolute;
      right: -62px;
      font-size: 13px;
      color: #1b2a4a;
      background: rgba(255,255,255,0.85);
      padding: 1px 6px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .floor.lobby { background: #8a8fa3; }
    .floor.lobby .door {
      width: 28px; height: 28px;
      margin-top: 6px;
      background: #4b3a2a;
      border-radius: 14px 14px 0 0;
    }
    @keyframes drop-in {
      from { transform: translateY(-120px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    #tower.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(-50%); }
      25% { transform: translateX(calc(-50% - 8px)) rotate(-2deg); }
      75% { transform: translateX(calc(-50% + 8px)) rotate(2deg); }
    }

    #panda {
      position: absolute;
      left: 50%;
      font-size: 46px;
      transform: translateX(-50%);
      transition: bottom 0.5s cubic-bezier(.3,1.5,.5,1);
      z-index: 5;
      line-height: 1;
    }
    #panda.hop { animation: hop 0.5s; }
    @keyframes hop {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      40% { transform: translateX(-50%) translateY(-30px) rotate(-10deg); }
    }
    #panda-bubble {
      position: absolute;
      left: calc(50% + 34px);
      background: #fff;
      color: #1b2a4a;
      font-size: 15px;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
      transition: bottom 0.5s, opacity 0.3s;
      z-index: 6;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    #panda-bubble.hidden { opacity: 0; }

    /* ── Question panel ── */
    #panel {
      background: #1b2a4a;
      padding: 16px 18px 20px;
      color: #fff;
      text-align: center;
    }
    #question {
      font-size: 44px;
      font-weight: bold;
      margin-bottom: 4px;
      letter-spacing: 2px;
    }
    #question .q { color: #ffd43b; }
    #feedback {
      height: 24px;
      font-size: 18px;
      margin-bottom: 10px;
    }
    #feedback.good { color: #8ce99a; }
    #feedback.bad  { color: #ffa8a8; }
    #answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .ans {
      font-family: inherit;
      font-size: 30px;
      font-weight: bold;
      padding: 12px 0;
      border: none;
      border-radius: 16px;
      color: #1b2a4a;
      background: linear-gradient(180deg, #b2f2bb, #69db7c);
      box-shadow: 0 5px 0 #2f9e44;
      cursor: pointer;
      transition: transform 0.08s;
    }
    .ans:active { transform: translateY(3px); box-shadow: 0 2px 0 #2f9e44; }
    .ans:disabled { cursor: default; }
    .ans.right { background: linear-gradient(180deg, #ffe066, #fcc419); box-shadow: 0 5px 0 #e67700; }
    .ans.wrong { background: linear-gradient(180deg, #ffc9c9, #ff8787); box-shadow: 0 5px 0 #c92a2a; }
    .ans .key { font-size: 13px; opacity: 0.55; margin-right: 6px; vertical-align: middle; }

    /* ── Overlay screens ── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px 18px;
      background: rgba(13, 27, 61, 0.92);
      z-index: 20;
      text-align: center;
      color: #fff;
      overflow-y: auto;
    }
    .screen.hidden { display: none; }
    .screen h1 { font-size: 34px; color: #ffd43b; text-shadow: 0 3px 0 #e67700; }
    .screen h2 { font-size: 28px; color: #ffd43b; }
    .screen p  { color: #dde; font-size: 17px; line-height: 1.5; }
    .big-emoji { font-size: 64px; }

    #table-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 380px;
    }
    .table-btn {
      font-family: inherit;
      font-size: 22px;
      font-weight: bold;
      padding: 10px 0 6px;
      border: none;
      border-radius: 14px;
      background: #fff;
      color: #1b2a4a;
      box-shadow: 0 4px 0 #8a8fa3;
      cursor: pointer;
    }
    .table-btn small { display: block; font-size: 12px; min-height: 15px; color: #e67700; }
    .table-btn:active { transform: translateY(2px); }

    .btn {
      font-family: inherit;
      font-size: 22px;
      font-weight: bold;
      padding: 12px 28px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #ff8787, #f06595);
      color: #fff;
      box-shadow: 0 5px 0 #a61e4d;
      cursor: pointer;
    }
    .btn.alt { background: linear-gradient(135deg, #74c0fc, #4dabf7); box-shadow: 0 5px 0 #1864ab; }
    .btn:active { transform: translateY(3px); }

    #stars { font-size: 44px; letter-spacing: 6px; }
    #table-sheet {
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 10px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 22px;
      font-size: 17px;
      color: #fff;
    }
    #table-sheet .missed { color: #ffa8a8; font-weight: bold; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
<div id="game-wrap">

  <div id="hud">
    <span id="hud-table">🏙️ Table of 1</span>
    <span id="hud-floors">🏢 0 / 10</span>
    <span class="streak" id="hud-streak"></span>
  </div>

  <div id="scene">
    <div class="sun">☀️</div>
    <div class="cloud" style="top:70px; animation-duration:38s; animation-delay:-10s">☁️</div>
    <div class="cloud" style="top:130px; animation-duration:52s; animation-delay:-30s; font-size:34px">☁️</div>
    <div id="world">
      <div id="skyline"></div>
      <div id="ground"></div>
      <div class="bamboo" style="left:8px">🎋</div>
      <div class="bamboo" style="right:10px">🎍</div>
      <div id="tower"></div>
      <div id="panda">🐼</div>
      <div id="panda-bubble" class="hidden"></div>
    </div>
  </div>

  <div id="panel">
    <div id="question">? × ? = <span class="q">?</span></div>
    <div id="feedback"></div>
    <div id="answers"></div>
  </div>

  <!-- Start screen -->
  <div id="screen-start" class="screen">
    <div class="big-emoji">🐼🏙️</div>
    <h1>Panda Skyscraper</h1>
    <p>Help Panda build the tallest skyscraper in the city!<br>
       Every right answer adds a new floor. 🏢</p>
    <p><b>Pick a times table:</b></p>
    <div id="table-grid"></div>
    <button class="btn alt" id="btn-mix">🎲 Mix all tables (1–10)</button>
    <p style="font-size:13px; color:#99a">Tip: use the keys 1–4 to pick an answer</p>
  </div>

  <!-- Finished screen -->
  <div id="screen-over" class="screen hidden">
    <div class="big-emoji">🐼🎉</div>
    <h2 id="over-title">Skyscraper finished!</h2>
    <div id="stars"></div>
    <p id="over-text"></p>
    <div id="table-sheet"></div>
    <div class="btn-row">
      <button class="btn" id="btn-again">🔁 Again</button>
      <button class="btn alt" id="btn-menu">🏙️ Other table</button>
    </div>
  </div>
</div>

<script>
const FLOORS_TO_BUILD = 10;
const FLOOR_H = 34;
const LOBBY_H = 34;
const GROUND_H = 46;
const FLOOR_COLORS = ['#e85d75', '#f59f00', '#4dabf7', '#9775fa', '#20c997',
                      '#ff922b', '#f06595', '#5c7cfa', '#51cf66', '#fab005'];
const CHEERS = ['Great job! 🎉', 'Super! ⭐', 'Yes! 🐼', 'Brilliant! 🏢', 'Bamboo-tastic! 🎋',
                'Well done! 👏', 'Fantastic! 🌟'];

const sceneEl    = document.getElementById('scene');
const worldEl    = document.getElementById('world');
const skylineEl  = document.getElementById('skyline');
const towerEl    = document.getElementById('tower');
const pandaEl    = document.getElementById('panda');
const bubbleEl   = document.getElementById('panda-bubble');
const questionEl = document.getElementById('question');
const feedbackEl = document.getElementById('feedback');
const answersEl  = document.getElementById('answers');
const hudTable   = document.getElementById('hud-table');
const hudFloors  = document.getElementById('hud-floors');
const hudStreak  = document.getElementById('hud-streak');
const screenStart = document.getElementById('screen-start');
const screenOver  = document.getElementById('screen-over');
const tableGrid   = document.getElementById('table-grid');

let table = 1;          // 1–10, or 0 for "mix"
let queue = [];         // questions still to answer: [a, b]
let floors = 0;
let mistakes = 0;
let streak = 0;
let missed = new Set(); // "a×b" strings answered wrong this round
let current = null;
let locked = false;

// ── Best results (stars per table) ──
function loadBest() {
  try { return JSON.parse(localStorage.getItem('panda-tables-best')) || {}; }
  catch { return {}; }
}
function saveBest(key, stars) {
  const best = loadBest();
  if ((best[key] || 0) >= stars) return;
  best[key] = stars;
  try { localStorage.setItem('panda-tables-best', JSON.stringify(best)); } catch {}
}

// ── Sound effects (tiny WebAudio beeps) ──
let audio = null;
function tone(freq, start, dur, type = 'sine') {
  if (!audio) return;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.18, audio.currentTime + start);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + start + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(audio.currentTime + start);
  osc.stop(audio.currentTime + start + dur);
}
function playRight() { tone(660, 0, 0.12); tone(880, 0.1, 0.18); }
function playWrong() { tone(220, 0, 0.25, 'triangle'); tone(180, 0.15, 0.3, 'triangle'); }
function playWin()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.25)); }

// ── Scenery ──
function buildSkyline() {
  const colors = ['#5f6b8a', '#4a5578', '#6d7a99', '#3f4a6b', '#7a86a6'];
  const spots = [[0, 60, 190], [52, 44, 280], [100, 56, 150], [330, 50, 240], [372, 60, 320], [428, 52, 200]];
  skylineEl.innerHTML = '';
  spots.forEach(([left, width, height], i) => {
    const b = document.createElement('div');
    b.className = 'bg-building';
    b.style.left = (left / 480 * 100) + '%';
    b.style.width = width + 'px';
    b.style.height = height + 'px';
    b.style.backgroundColor = colors[i % colors.length];
    skylineEl.appendChild(b);
  });
}

function buildMenu() {
  const best = loadBest();
  tableGrid.innerHTML = '';
  for (let t = 1; t <= 10; t++) {
    const btn = document.createElement('button');
    btn.className = 'table-btn';
    btn.innerHTML = `${t}<small>${'⭐'.repeat(best[t] || 0)}</small>`;
    btn.onclick = () => startGame(t);
    tableGrid.appendChild(btn);
  }
  document.getElementById('btn-mix').textContent =
    `🎲 Mix all tables (1–10) ${'⭐'.repeat(best.mix || 0)}`;
}

// ── Tower ──
function resetTower() {
  towerEl.innerHTML = '';
  const lobby = document.createElement('div');
  lobby.className = 'floor lobby';
  lobby.style.animation = 'none';
  lobby.innerHTML = '<span class="win"></span><span class="door"></span><span class="win"></span>';
  towerEl.appendChild(lobby);
  floors = 0;
  placePanda(false);
}

function addFloor(a, b) {
  const f = document.createElement('div');
  f.className = 'floor';
  f.style.setProperty('--c', FLOOR_COLORS[floors % FLOOR_COLORS.length]);
  f.innerHTML = '<span class="win"></span><span class="win"></span><span class="win"></span><span class="win"></span>' +
                `<span class="label">${a}×${b}=${a * b}</span>`;
  towerEl.appendChild(f);
  floors++;
  placePanda(true);
}

function addRoof() {
  const roof = document.createElement('div');
  roof.style.cssText = 'font-size:34px; line-height:1; animation: drop-in 0.5s;';
  roof.textContent = '🚩';
  towerEl.appendChild(roof);
}

function towerTop() { return GROUND_H + LOBBY_H + floors * FLOOR_H; }

function placePanda(hop) {
  const top = towerTop();
  pandaEl.style.bottom = (top - 4) + 'px';
  bubbleEl.style.bottom = (top + 34) + 'px';
  if (hop) {
    pandaEl.classList.remove('hop');
    void pandaEl.offsetWidth;
    pandaEl.classList.add('hop');
  }
  // Move the camera down when the tower gets taller than the view.
  const room = sceneEl.clientHeight - 140;
  const shift = Math.max(0, top - room);
  worldEl.style.transform = `translateY(${shift}px)`;
}

let bubbleTimer = null;
function say(text, ms = 1400) {
  bubbleEl.textContent = text;
  bubbleEl.classList.remove('hidden');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubbleEl.classList.add('hidden'), ms);
}

// ── Questions ──
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function makeQueue() {
  const qs = [];
  for (let i = 1; i <= FLOORS_TO_BUILD; i++) {
    if (table === 0) {
      qs.push([1 + Math.floor(Math.random() * 10), 1 + Math.floor(Math.random() * 10)]);
    } else {
      // Mix up the order so the table isn't simply recited.
      qs.push(Math.random() < 0.5 ? [i, table] : [table, i]);
    }
  }
  return shuffle(qs);
}

function makeChoices(a, b) {
  const answer = a * b;
  const options = new Set([answer]);
  // Typical mix-ups: one more/less group, or a neighbouring answer.
  const near = [(a + 1) * b, (a - 1) * b, a * (b + 1), a * (b - 1), answer + 1, answer - 1, answer + 10, answer - 10, a + b];
  shuffle(near);
  for (const n of near) {
    if (options.size >= 4) break;
    if (n > 0 && n <= 110) options.add(n);
  }
  while (options.size < 4) options.add(1 + Math.floor(Math.random() * 100));
  return shuffle([...options]);
}

function nextQuestion() {
  if (floors >= FLOORS_TO_BUILD) { finish(); return; }
  current = queue.shift();
  const [a, b] = current;
  questionEl.innerHTML = `${a} × ${b} = <span class="q">?</span>`;
  feedbackEl.textContent = '';
  feedbackEl.className = '';
  answersEl.innerHTML = '';
  makeChoices(a, b).forEach((value, i) => {
    const btn = document.createElement('button');
    btn.className = 'ans';
    btn.innerHTML = `<span class="key">${i + 1}</span>${value}`;
    btn.dataset.value = value;
    btn.onclick = () => choose(btn);
    answersEl.appendChild(btn);
  });
  locked = false;
}

function choose(btn) {
  if (locked) return;
  locked = true;
  const [a, b] = current;
  const answer = a * b;
  const buttons = [...answersEl.children];
  buttons.forEach(x => x.disabled = true);

  if (Number(btn.dataset.value) === answer) {
    btn.classList.add('right');
    streak++;
    playRight();
    questionEl.innerHTML = `${a} × ${b} = <span class="q">${answer}</span>`;
    feedbackEl.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    feedbackEl.className = 'good';
    addFloor(a, b);
    if (streak >= 3) say(`${streak} in a row! 🔥`);
    updateHud();
    setTimeout(nextQuestion, 1000);
  } else {
    btn.classList.add('wrong');
    buttons.find(x => Number(x.dataset.value) === answer).classList.add('right');
    streak = 0;
    mistakes++;
    missed.add(`${a}×${b}`);
    playWrong();
    questionEl.innerHTML = `${a} × ${b} = <span class="q">${answer}</span>`;
    feedbackEl.textContent = `Oops! ${a} × ${b} = ${answer}. We'll try it again later.`;
    feedbackEl.className = 'bad';
    say('Wobble wobble! 😵');
    towerEl.classList.remove('shake');
    void towerEl.offsetWidth;
    towerEl.classList.add('shake');
    // Ask the same sum again a bit later so it sticks.
    queue.splice(Math.min(2, queue.length), 0, current);
    updateHud();
    setTimeout(nextQuestion, 2300);
  }
}

function updateHud() {
  hudTable.textContent = table === 0 ? '🎲 Mixed' : `🏙️ Table of ${table}`;
  hudFloors.textContent = `🏢 ${floors} / ${FLOORS_TO_BUILD}`;
  hudStreak.textContent = streak >= 2 ? `🔥 ${streak}` : '';
}

// ── Game flow ──
function startGame(t) {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  }
  table = t;
  queue = makeQueue();
  mistakes = 0;
  streak = 0;
  missed = new Set();
  screenStart.classList.add('hidden');
  screenOver.classList.add('hidden');
  resetTower();
  updateHud();
  say(table === 0 ? "Let's mix it up! 🎲" : `Table of ${table}! Let's build! 🏗️`, 1800);
  nextQuestion();
}

function finish() {
  locked = true;
  addRoof();
  playWin();
  say('I can see the whole city! 🎉', 3000);
  const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
  saveBest(table === 0 ? 'mix' : table, stars);

  setTimeout(() => {
    document.getElementById('stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    document.getElementById('over-title').textContent =
      stars === 3 ? 'Perfect skyscraper!' : 'Skyscraper finished!';
    document.getElementById('over-text').textContent = mistakes === 0
      ? 'No mistakes at all — Panda is so proud of you! 🐼💖'
      : `You built ${FLOORS_TO_BUILD} floors with ${mistakes} wobble${mistakes === 1 ? '' : 's'}. Practice the red ones!`;

    const sheet = document.getElementById('table-sheet');
    sheet.innerHTML = '';
    if (table === 0) {
      sheet.style.display = missed.size ? 'grid' : 'none';
      missed.forEach(s => {
        const [a, b] = s.split('×').map(Number);
        sheet.innerHTML += `<span class="missed">${a} × ${b} = ${a * b}</span>`;
      });
    } else {
      sheet.style.display = 'grid';
      // Column-wise order: 1–5 left, 6–10 right.
      for (let row = 1; row <= 5; row++) {
        for (const i of [row, row + 5]) {
          const isMissed = missed.has(`${i}×${table}`) || missed.has(`${table}×${i}`);
          sheet.innerHTML += `<span class="${isMissed ? 'missed' : ''}">${i} × ${table} = ${i * table}</span>`;
        }
      }
    }
    screenOver.classList.remove('hidden');
  }, 1600);
}

// ── Input ──
document.addEventListener('keydown', e => {
  if (!screenStart.classList.contains('hidden') || !screenOver.classList.contains('hidden')) return;
  const n = Number(e.key);
  if (n >= 1 && n <= 4 && answersEl.children[n - 1]) choose(answersEl.children[n - 1]);
});
document.getElementById('btn-mix').onclick = () => startGame(0);
document.getElementById('btn-again').onclick = () => startGame(table);
document.getElementById('btn-menu').onclick = () => {
  screenOver.classList.add('hidden');
  buildMenu();
  screenStart.classList.remove('hidden');
};
window.addEventListener('resize', () => placePanda(false));

buildSkyline();
buildMenu();
resetTower();
</script>
</body>
